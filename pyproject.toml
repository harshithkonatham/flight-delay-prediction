[project]
name = "flightdelay"
version = "0.1.0"
description = "Pipeline and model that predicts US flight arrival delays from pre-departure information"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Harshith Konatham" }]
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "scikit-learn>=1.5",
    "joblib>=1.4",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
report = ["matplotlib>=3.9"]

[project.scripts]
flightdelay = "flightdelay.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flightdelay"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "PL"]
ignore = ["PLR2004", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311", "S608", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["e2e: end-to-end tests that run the whole pipeline"]

[tool.coverage.run]
source = ["flightdelay"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
